{% extends 'base.html' %}

{% block title %}{{ titulo }} - Fichas{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header d-flex align-items-center justify-content-between">
                <h2 class="h4 mb-0">{{ titulo }}</h2>
                <a href="{% url 'proyectos:ficha_list' %}" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left me-1"></i>Volver
                </a>
            </div>
            <div class="card-body">
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% include 'formulario_horizontal.html' with form=form submit_label=submit_label cancel_url=cancel_url %}
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
